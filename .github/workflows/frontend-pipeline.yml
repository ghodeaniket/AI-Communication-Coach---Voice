name: Frontend CI/CD Pipeline

on:
  push:
    branches: [ main, development, staging ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-pipeline.yml'
  pull_request:
    branches: [ main, development ]
    paths:
      - 'frontend/**'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run linting
        run: npm run check || echo "Type checking failed but continuing"
        
      - name: Run tests
        run: npm test

  build-development:
    needs: lint-and-test
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    environment: development
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json
          
      - name: Install dependencies
        run: npm ci
        
      - name: Create environment file
        run: |
          cat > .env.production << EOF
          VITE_API_ENDPOINT=${{ secrets.DEV_API_ENDPOINT }}
          VITE_AWS_ENDPOINT=${{ secrets.DEV_AWS_ENDPOINT }}
          VITE_AWS_REGION=${{ secrets.DEV_AWS_REGION }}
          VITE_USE_LOCAL_SERVICES=false
          VITE_USE_MOCK_SERVICES=false
          VITE_MAX_RECORDING_DURATION=120
          VITE_AUDIO_SAMPLE_RATE=44100
          VITE_AUDIO_NOISE_REDUCTION=true
          VITE_FEATURE_ADVANCED_METRICS=true
          VITE_FEATURE_RECORDING_COMPARISON=true
          VITE_FEATURE_SOCIAL_SHARING=false
          EOF
        
      - name: Build for development
        run: npm run build
        
      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: frontend-dev-build
          path: ./frontend/dist
          
      - name: Deploy to development
        run: |
          # Placeholder for AWS S3 deployment command
          # aws s3 sync dist/ s3://${{ secrets.DEV_S3_BUCKET }} --delete
          # aws cloudfront create-invalidation --distribution-id ${{ secrets.DEV_CLOUDFRONT_ID }} --paths "/*"
          echo "Deployed to development environment"

  build-staging:
    needs: lint-and-test
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json
          
      - name: Install dependencies
        run: npm ci
        
      - name: Create environment file
        run: |
          cat > .env.production << EOF
          VITE_API_ENDPOINT=${{ secrets.STAGING_API_ENDPOINT }}
          VITE_AWS_REGION=${{ secrets.STAGING_AWS_REGION }}
          VITE_USE_LOCAL_SERVICES=false
          VITE_USE_MOCK_SERVICES=false
          VITE_MAX_RECORDING_DURATION=120
          VITE_AUDIO_SAMPLE_RATE=44100
          VITE_AUDIO_NOISE_REDUCTION=true
          VITE_FEATURE_ADVANCED_METRICS=true
          VITE_FEATURE_RECORDING_COMPARISON=true
          VITE_FEATURE_SOCIAL_SHARING=false
          EOF
        
      - name: Build for staging
        run: npm run build
        
      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: frontend-staging-build
          path: ./frontend/dist
          
      - name: Deploy to staging
        run: |
          # Placeholder for AWS S3 deployment command
          # aws s3 sync dist/ s3://${{ secrets.STAGING_S3_BUCKET }} --delete
          # aws cloudfront create-invalidation --distribution-id ${{ secrets.STAGING_CLOUDFRONT_ID }} --paths "/*"
          echo "Deployed to staging environment"

  build-production:
    needs: lint-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json
          
      - name: Install dependencies
        run: npm ci
        
      - name: Create environment file
        run: |
          cat > .env.production << EOF
          VITE_API_ENDPOINT=${{ secrets.PROD_API_ENDPOINT }}
          VITE_AWS_REGION=${{ secrets.PROD_AWS_REGION }}
          VITE_USE_LOCAL_SERVICES=false
          VITE_USE_MOCK_SERVICES=false
          VITE_MAX_RECORDING_DURATION=180
          VITE_AUDIO_SAMPLE_RATE=44100
          VITE_AUDIO_NOISE_REDUCTION=true
          VITE_FEATURE_ADVANCED_METRICS=true
          VITE_FEATURE_RECORDING_COMPARISON=true
          VITE_FEATURE_SOCIAL_SHARING=true
          EOF
        
      - name: Build for production
        run: npm run build
        
      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: frontend-prod-build
          path: ./frontend/dist
          
      - name: Deploy to production
        run: |
          # Placeholder for AWS S3 deployment command
          # aws s3 sync dist/ s3://${{ secrets.PROD_S3_BUCKET }} --delete
          # aws cloudfront create-invalidation --distribution-id ${{ secrets.PROD_CLOUDFRONT_ID }} --paths "/*"
          echo "Deployed to production environment"
