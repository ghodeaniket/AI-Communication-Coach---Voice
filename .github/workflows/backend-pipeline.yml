name: Backend CI/CD Pipeline

on:
  push:
    branches: [ main, development, staging ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-pipeline.yml'
  pull_request:
    branches: [ main, development ]
    paths:
      - 'backend/**'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: ./backend/package-lock.json
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run linting
        run: npm run lint || echo "Linting failed but continuing"
        
      - name: Run tests
        run: npm test

  deploy-development:
    needs: lint-and-test
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    environment: development
    defaults:
      run:
        working-directory: ./backend
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: ./backend/package-lock.json
          
      - name: Install dependencies
        run: npm ci
        
      - name: Install AWS CLI
        uses: unfor19/install-aws-cli-action@v1
        with:
          version: 2
          
      - name: Install SAM CLI
        uses: aws-actions/setup-sam@v2
        
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.DEV_AWS_REGION }}
          
      - name: Build with SAM
        run: |
          sam build --template-file template.yaml
          
      - name: Deploy to development
        run: |
          # Placeholder for actual deployment command
          # sam deploy --stack-name voice-coach-dev \
          #   --parameter-overrides \
          #   Environment=dev \
          #   WhisperApiKey=${{ secrets.DEV_WHISPER_API_KEY }}
          echo "Deployed to development environment"
          
      - name: Run smoke tests
        run: |
          echo "Running smoke tests on development environment"
          # Add basic health check or smoke test here

  deploy-staging:
    needs: lint-and-test
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: ./backend
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: ./backend/package-lock.json
          
      - name: Install dependencies
        run: npm ci
        
      - name: Install AWS CLI
        uses: unfor19/install-aws-cli-action@v1
        with:
          version: 2
          
      - name: Install SAM CLI
        uses: aws-actions/setup-sam@v2
        
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.STAGING_AWS_REGION }}
          
      - name: Build with SAM
        run: |
          sam build --template-file template.yaml
          
      - name: Deploy to staging
        run: |
          # Placeholder for actual deployment command
          # sam deploy --stack-name voice-coach-staging \
          #   --parameter-overrides \
          #   Environment=staging \
          #   WhisperApiKey=${{ secrets.STAGING_WHISPER_API_KEY }}
          echo "Deployed to staging environment"
          
      - name: Run integration tests
        run: |
          echo "Triggering integration tests on staging environment"
          # This would call the integration tests workflow

  deploy-production:
    needs: lint-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: ./backend
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: ./backend/package-lock.json
          
      - name: Install dependencies
        run: npm ci
        
      - name: Install AWS CLI
        uses: unfor19/install-aws-cli-action@v1
        with:
          version: 2
          
      - name: Install SAM CLI
        uses: aws-actions/setup-sam@v2
        
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.PROD_AWS_REGION }}
          
      - name: Build with SAM
        run: |
          sam build --template-file template.yaml
          
      - name: Deploy to production
        run: |
          # Placeholder for actual deployment command
          # sam deploy --stack-name voice-coach-prod \
          #   --parameter-overrides \
          #   Environment=prod \
          #   WhisperApiKey=${{ secrets.PROD_WHISPER_API_KEY }}
          echo "Deployed to production environment"
          
      - name: Run smoke tests
        run: |
          echo "Running smoke tests on production environment"
          # Add basic health check or smoke test here
