name: Security Scan

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, staging ]
  schedule:
    - cron: '0 0 * * 1' # Run weekly on Mondays
  workflow_dispatch:

jobs:
  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          
      - name: Scan frontend dependencies
        working-directory: ./frontend
        run: |
          if [ -f package-lock.json ]; then
            npm audit --json > ../frontend-audit.json || true
          fi
          
      - name: Scan backend dependencies
        working-directory: ./backend
        run: |
          if [ -f package-lock.json ]; then
            npm audit --json > ../backend-audit.json || true
          fi
          
      - name: Upload scan results
        uses: actions/upload-artifact@v3
        with:
          name: dependency-scan-results
          path: |
            frontend-audit.json
            backend-audit.json

  code-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          
      - name: Install SonarCloud scanner
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          npm install -g sonarqube-scanner
        
      - name: Run SonarCloud scan
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          echo "Sonar scan would run here if tokens were configured"
          # sonar-scanner \
          #   -Dsonar.host.url=https://sonarcloud.io \
          #   -Dsonar.projectKey=${{ github.repository_owner }}_voice-coach \
          #   -Dsonar.organization=${{ github.repository_owner }}
          
      - name: Run ESLint
        run: |
          cd frontend
          if [ -f package.json ] && grep -q '"eslint"' package.json; then
            npm ci
            npx eslint --format json --output-file ../eslint-report.json src || true
          else
            echo "ESLint not configured for frontend"
          fi
          
          cd ../backend
          if [ -f package.json ] && grep -q '"eslint"' package.json; then
            npm ci
            npx eslint --format json --output-file ../eslint-report-backend.json src || true
          else
            echo "ESLint not configured for backend"
          fi
          
      - name: Upload scan results
        uses: actions/upload-artifact@v3
        with:
          name: code-scan-results
          path: |
            eslint-report.json
            eslint-report-backend.json

  infrastructure-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install checkov
        run: |
          python -m pip install --upgrade pip
          pip install checkov
          
      - name: Scan CloudFormation/SAM Templates
        run: |
          if [ -d backend ]; then
            checkov -d backend --framework cloudformation -o cli -o json --output-file-path checkov-results
          fi
          
      - name: Scan Dockerfile
        run: |
          checkov -d . --framework dockerfile -o cli -o json --output-file-path checkov-results
          
      - name: Upload scan results
        uses: actions/upload-artifact@v3
        with:
          name: infrastructure-scan-results
          path: checkov-results
