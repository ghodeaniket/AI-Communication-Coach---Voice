AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Voice Coach Backend Services

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Environment name

  OpenAIApiKey:
    Type: String
    NoEcho: true
    Description: API key for OpenAI services

  CorsAllowedOrigins:
    Type: String
    Default: '*'
    Description: Comma-separated list of allowed origins for CORS

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: nodejs18.x
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        OPENAI_API_KEY: !Ref OpenAIApiKey
        CORS_ALLOWED_ORIGINS: !Ref CorsAllowedOrigins
        DYNAMODB_TABLE: !Ref ResultsTable
    Architectures:
      - x86_64

Resources:
  # API Gateway
  VoiceCoachApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Environment
      Cors:
        AllowMethods: "'GET,POST,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: !Sub "'${CorsAllowedOrigins}'"
      Auth:
        DefaultAuthorizer: NONE
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${CorsAllowedOrigins}'"
              Access-Control-Allow-Methods: "'GET,POST,DELETE,OPTIONS'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${CorsAllowedOrigins}'"
              Access-Control-Allow-Methods: "'GET,POST,DELETE,OPTIONS'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization'"

  # Lambda Functions
  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: dist/handlers/health.handler
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref VoiceCoachApi
            Path: /health
            Method: get
      Policies:
        - AWSLambdaBasicExecutionRole

  TranscriptionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: dist/handlers/transcription.handler
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref VoiceCoachApi
            Path: /transcribe
            Method: post
      Policies:
        - AWSLambdaBasicExecutionRole

  SpeechAnalyticsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: dist/handlers/speechAnalytics.handler
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref VoiceCoachApi
            Path: /analyze
            Method: post
      Policies:
        - AWSLambdaBasicExecutionRole

  FeedbackFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: dist/handlers/feedback.handler
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref VoiceCoachApi
            Path: /feedback
            Method: post
      Policies:
        - AWSLambdaBasicExecutionRole

  # Results API Functions
  SaveResultFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: dist/handlers/results.saveResult
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref VoiceCoachApi
            Path: /results
            Method: post
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy:
            TableName: !Ref ResultsTable

  GetResultFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: dist/handlers/results.getResult
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref VoiceCoachApi
            Path: /results/{id}
            Method: get
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBReadPolicy:
            TableName: !Ref ResultsTable

  ListResultsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: dist/handlers/results.listResults
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref VoiceCoachApi
            Path: /results
            Method: get
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBReadPolicy:
            TableName: !Ref ResultsTable

  DeleteResultFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: dist/handlers/results.deleteResult
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref VoiceCoachApi
            Path: /results/{id}
            Method: delete
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy:
            TableName: !Ref ResultsTable

  # DynamoDB Table for storing user results
  ResultsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "voice-coach-results-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: UserIdIndex
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${VoiceCoachApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
  
  HealthFunction:
    Description: Health Check Lambda Function ARN
    Value: !GetAtt HealthFunction.Arn
  
  TranscriptionFunction:
    Description: Transcription Lambda Function ARN
    Value: !GetAtt TranscriptionFunction.Arn
  
  SpeechAnalyticsFunction:
    Description: Speech Analytics Lambda Function ARN
    Value: !GetAtt SpeechAnalyticsFunction.Arn
  
  FeedbackFunction:
    Description: Feedback Generation Lambda Function ARN
    Value: !GetAtt FeedbackFunction.Arn
  
  SaveResultFunction:
    Description: Save Result Lambda Function ARN
    Value: !GetAtt SaveResultFunction.Arn
  
  GetResultFunction:
    Description: Get Result Lambda Function ARN
    Value: !GetAtt GetResultFunction.Arn
  
  ListResultsFunction:
    Description: List Results Lambda Function ARN
    Value: !GetAtt ListResultsFunction.Arn
  
  DeleteResultFunction:
    Description: Delete Result Lambda Function ARN
    Value: !GetAtt DeleteResultFunction.Arn
  
  ResultsTableName:
    Description: Name of the DynamoDB table for storing results
    Value: !Ref ResultsTable
